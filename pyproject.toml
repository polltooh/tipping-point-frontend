[tool.poetry]
name = "catalyst-backend"
version = "0.1.0"
description = "Catalyst AI Natural-Language to Strategy DAG & Trading Decision Backend (LangChain + LangGraph + Polygon.io + FastAPI)"
authors = ["Catalyst Engineering <eng@catalyst.app>"]
readme = "README.md"
packages = [{include = "catalyst_backend", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
fastapi = ">=0.115.0"
uvicorn = {extras = ["standard"], version = ">=0.32.0"}
pydantic = ">=2.7.0"
dynaconf = ">=3.2.4"
httpx = ">=0.27.0"
requests = ">=2.31.0"
langchain = ">=0.3.0"
langchain-core = ">=0.3.0"
langchain-openai = ">=0.2.0"
langgraph = ">=0.2.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"
ruff = ">=0.3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
indent-width = 4
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
